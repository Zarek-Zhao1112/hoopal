<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#dce7ed">
  <meta name="description" content="球搭 HOOPAL：本地离线的篮球战术板，建立3v3与4v4球队、确认战术条件与本队分工，观看内置进攻与防守动画。">
  <title>球搭 · HOOPAL</title>
  <link rel="icon" type="image/png" href="./assets/app-icon.png">
  <link rel="stylesheet" href="./styles/app.css">
</head>
<body class="page-layout" data-view="lineups" data-tactic-kind="offense" data-catalog-kind="offense">
  <section id="startup-screen" aria-label="球搭正在启动">
    <div id="startup-frame"><div id="startup-media"><div id="startup-cabinet"></div></div></div>
    <div id="startup-rim" aria-hidden="true"></div>
    <div id="startup-brand" aria-hidden="true"><img src="./assets/app-icon.png" alt=""><div><strong>HOOPAL</strong><span>球搭</span></div></div>
    <button id="startup-skip" type="button">跳过</button>
    <p id="startup-status" role="status" hidden>正在读取本机球队…</p>
    <div id="startup-error" hidden><p id="startup-message" role="alert"></p><button id="startup-retry" type="button">重新打开</button></div>
  </section>
  <svg aria-hidden="true" class="icon-defs" xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-ball" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3v18M6 5c7 5 7 9 0 14M18 5c-7 5-7 9 0 14"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8" cy="8" r="1.5"/><path d="m3 17 6-6 4 4 3-3 5 5"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="m8 4-6 6 6 6M2 10h12a7 7 0 0 1 0 14" transform="translate(2 -3) scale(.9)"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path d="m16 4 6 6-6 6M22 10H10a7 7 0 0 0 0 14" transform="translate(0 -3) scale(.9)"/></symbol>
    <symbol id="i-cursor" viewBox="0 0 24 24"><path d="m5 3 14 10-7 1-3 7-4-18Z"/></symbol>
    <symbol id="i-run" viewBox="0 0 24 24"><path d="M3 20 20 3M10 3h10v10"/></symbol>
    <symbol id="i-pass" viewBox="0 0 24 24"><path d="m3 20 3-3m3-3 3-3m3-3 5-5M10 3h10v10"/></symbol>
    <symbol id="i-screen" viewBox="0 0 24 24"><path d="M4 20 17 7M11 3l10 10"/></symbol>
    <symbol id="i-dribble" viewBox="0 0 24 24"><path d="m3 21 2-7 5 1 1-6 5 1 4-7M11 3h9v9"/></symbol>
    <symbol id="i-erase" viewBox="0 0 24 24"><path d="m4 13 10-10 7 7L11 20H6l-4-4 2-3ZM9 8l7 7M11 20h11"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="m8 4 12 8-12 8V4Z"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M7 5h3v14H7zM14 5h3v14h-3z"/></symbol>
    <symbol id="i-left" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></symbol>
    <symbol id="i-right" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 6h16M9 6V3h6v3M6 6l1 15h10l1-15M10 10v7M14 10v7"/></symbol>
    <symbol id="i-reset" viewBox="0 0 24 24"><path d="M4 10a8 8 0 1 1 1 8M4 3v7h7"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 6h7l2 3h9v12H3V6Z"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5"/></symbol>
    <symbol id="i-tactics" viewBox="0 0 24 24"><path d="M8 4H5v17h14V4h-3M9 2h6v5H9Z"/><circle cx="9" cy="12" r="1"/><path d="m13 11 3 3m0-3-3 3M8 17h7"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M12 5Q7 2 2 4v15q5-2 10 1 5-3 10-1V4q-5-2-10 1v15"/></symbol>
    <symbol id="i-appearance" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17Z" fill="currentColor" stroke="none"/></symbol>
  </svg>

  <header class="app-header" hidden aria-hidden="true">
    <input id="play-title" value="挡拆顺下" readonly aria-label="当前内置战术名称" tabindex="-1">
  </header>
  <span id="storage-status" class="save-status" role="status" hidden></span>
  <div class="page-top-space">
    <header id="primary-page-header" class="primary-page-header">
      <h1 id="primary-training-title">训练场</h1>
      <h1 id="primary-account-title">我的</h1>
      <button class="appearance-toggle" type="button" aria-label="切换到写实外观" aria-pressed="false" disabled><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-appearance"/></svg></button>
    </header>
  </div>

  <header id="lineup-brand-header" class="lineup-brand-header" aria-label="球搭 HOOPAL">
    <img src="./assets/app-icon.png" alt="球搭图标" class="lineup-brand-icon">
    <div><strong>HOOPAL</strong><span>球搭</span></div>
    <button class="appearance-toggle" type="button" aria-label="切换到写实外观" aria-pressed="false" disabled><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-appearance"/></svg></button>
  </header>

  <main class="workspace">
    <section id="lineups-panel" class="lineups-panel panel" aria-label="更衣室与我的球队"></section>
<section id="tactic-selection-panel" class="tactic-selection-panel" aria-label="按整体体型挑选战术" hidden></section>

    <section class="training-panel panel training-scene-card" aria-label="训练场">
      <header class="training-header">
        <h1 class="workspace-card-heading">训练场</h1>
        <div class="training-title-static">
          <h1 id="training-title">载入战术…</h1>
          <select id="template-picker" aria-label="选择内置战术" hidden aria-hidden="true" tabindex="-1"><option value="">选择示例</option></select>
        </div>
        <div id="play-header-controls" class="page-header-controls">
          <button id="open-tactic-library" class="button button-subtle" type="button" aria-haspopup="dialog" aria-controls="tactic-library-dialog">战术库</button>
          <label class="sr-only" for="mode">比赛人数</label><select id="mode" aria-label="比赛人数"><option value="3v3">3 对 3</option><option value="4v4">4 对 4</option></select>
          <button id="open-menu" class="icon-button menu-trigger" title="导出图片或战术文件" aria-label="导出与更多操作" aria-haspopup="dialog"><svg class="icon" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></button>
        </div>
        <div class="training-context"><span id="tactic-kind-label">进攻战术</span><label class="toggle-label"><input id="toggle-defense" type="checkbox" checked><span class="switch" aria-hidden="true"></span><span id="opponent-toggle-label">显示防守</span></label></div>
      </header>
      <div class="court-stage"><svg id="court" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 820" preserveAspectRatio="xMidYMid meet" role="img" aria-label="半场篮球战术动画，球员按战术职责编号"></svg></div>
      <span id="status" class="sr-only">按职责号观看配合，可选择步骤阅读讲解。</span>
      <section class="playback-bar panel" aria-label="战术动画回放">
        <div class="training-detail">
          <div id="lineup-legend" class="lineup-legend" aria-label="本队职责与队员对应"></div>
          <div class="play-note-summary">
            <div class="training-step-copy"><div class="training-step-heading"><strong id="training-step-title">准备站位</strong></div><p id="live-step-note" class="live-step-note">载入战术讲解…</p></div>
            <button id="open-note" type="button" class="note-open-button" title="分页阅读完整讲解" aria-haspopup="dialog">讲解 <svg class="icon"><use href="#i-right"/></svg></button>
          </div>
        </div>
        <div class="training-capsule" aria-label="战术播放控制">
          <label class="sr-only" for="speed">播放速度</label><select id="speed" aria-label="播放速度"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option></select>
          <div class="training-timeline">
            <div class="training-progress-heading"><span id="frame-counter">1 / 4</span><span id="play-progress">0%</span></div>
            <div class="training-scrub"><label class="sr-only" for="timeline-scrub">战术播放进度</label><input id="timeline-scrub" type="range" min="0" max="1000" value="0" step="1" aria-label="战术播放进度"><div id="frame-list" class="frame-list" aria-label="选择战术步骤"></div></div>
          </div>
          <button id="play-toggle" class="play-button" title="播放或暂停（空格）" aria-label="播放战术" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="#i-play"/></svg></button>
        </div>
      </section>
    </section>
  </main>

  <nav class="view-nav" aria-label="工作台页面">
    <button type="button" data-view-target="lineups" aria-pressed="true"><svg class="icon" viewBox="0 0 24 24"><circle cx="9" cy="7" r="3"/><path d="M3 20v-3a6 6 0 0 1 12 0v3M17 5a3 3 0 0 1 0 6M18 14a5 5 0 0 1 3 5"/></svg><span>更衣室</span></button>
    <button type="button" data-view-target="play" aria-pressed="false"><svg class="icon"><use href="#i-tactics"/></svg><span>训练场</span></button>
    <button type="button" data-view-target="archives" aria-pressed="false"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="7" r="4"/><path d="M5 21v-3a7 7 0 0 1 14 0v3"/></svg><span>我的</span></button>
  </nav>

  <dialog id="workspace-menu" class="workspace-dialog menu-dialog" aria-labelledby="menu-heading">
    <div class="dialog-heading"><h2 id="menu-heading">战术文件</h2><button id="close-menu" type="button" class="dialog-close icon-button" aria-label="关闭更多操作">×</button></div>
    <div class="menu-actions">
      <button id="export-png" type="button" class="button menu-action"><svg class="icon"><use href="#i-image"/></svg><span>导出当前步骤图片<small>PNG 图片，可分享给队友</small></span></button>
      <button id="export-json" type="button" class="button menu-action"><svg class="icon"><use href="#i-download"/></svg><span>导出战术文件<small>包含当前完整步骤与讲解</small></span></button>
    </div>
    <p class="dialog-hint">导出内置战术；本队人员对应关系在演练界面查看。</p>
  </dialog>

  <dialog id="note-dialog" class="workspace-dialog note-dialog" aria-labelledby="note-heading">
    <div class="dialog-heading"><h2 id="note-heading">这一步的讲解</h2><button id="close-note" type="button" class="dialog-close icon-button" aria-label="关闭讲解">×</button></div>
    <p id="note-preview" class="note-preview"></p>
    <div class="pagination note-pagination"><button id="note-page-prev" type="button" class="button button-subtle">上一页</button><span id="note-page-count">1 / 1</span><button id="note-page-next" type="button" class="button button-subtle">下一页</button></div>
  </dialog>

  <div id="toast-live" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>
  <div id="appearance-status" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
